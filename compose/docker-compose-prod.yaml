name: backend

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    container_name: brewly-app
    restart: unless-stopped
    build:
      context: ${BREWLY_BACKEND_ROOT:-../../brewly-backend}
      dockerfile: Dockerfile-prod
    env_file:
      - ${BREWLY_ENV_FILE:-../../secrets/production.env}
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-8080}
      POSTGRES_DB_HOST: db-prod
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      db-prod:
        condition: service_healthy
    volumes:
      - app-logs:/var/log/brewly-backend
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${APP_PORT}/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging: *service-logging

  db-prod:
    image: postgres:13
    container_name: brewly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *service-logging

  pgadmin:
    image: dpage/pgadmin4:9.12
    container_name: brewly-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:${SERVER_PGADMIN_PORT:-5050}:${PGADMIN_PORT:-80}"
    depends_on:
      db-prod:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    mem_limit: 256m
    logging: *service-logging

  loki:
    image: grafana/loki:2.7.3
    container_name: brewly-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    mem_limit: 256m
    logging: *service-logging

  promtail:
    image: grafana/promtail:2.7.3
    container_name: brewly-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - app-logs:/var/log/brewly-backend:ro
      - ../monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - promtail-positions:/tmp
    mem_limit: 128m
    logging: *service-logging

  grafana:
    image: grafana/grafana:9.2.0
    container_name: brewly-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 256m
    logging: *service-logging

volumes:
  db-prod-data:
  app-logs:
  promtail-positions:
  grafana-data:
  loki-data:
  pgadmin-data:
