all:
  children:
    backend_servers:
      hosts:
        brewly-firstvds:
          ansible_host: 176.12.68.205
  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'BREWLY_DEPLOY_SSH_KEY') | default('~/.ssh/toolkit-ci', true) }}"
    ansible_ssh_common_args: >-
      -o IdentitiesOnly=yes
      -o ForwardAgent=no
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ inventory_dir }}/../known_hosts/firstvds
